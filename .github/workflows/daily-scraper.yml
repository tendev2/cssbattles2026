name: Daily CSSBattle Scraper

on:
  schedule:
    # Runs daily at 00:05 UTC
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # Remove this line if you do not commit package-lock.json

      - name: Install Dependencies
        # Use "npm ci" if package-lock.json exists, otherwise fallback to "npm install"
        run: npm ci || npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Scraper
        run: npm run scrape

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update daily CSSBattle submissions [$(date -u +'%Y-%m-%d')]" && git push)
