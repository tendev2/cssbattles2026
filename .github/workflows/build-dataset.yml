name: Build CSSBattle Dataset

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "images/**"
      - "build-dataset.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build dataset_final.json
        run: npm run build-dataset

      - name: Commit and push dataset_final.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset_final.json
          if git diff --staged --quiet; then
            echo "No changes to dataset.json"
          else
            git commit -m "chore: update dataset_final.json"
            git push
          fi
